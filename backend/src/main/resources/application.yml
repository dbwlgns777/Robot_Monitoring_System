spring:
  application.name: prima-factory-360-backend
  config.import: optional:file:.env[.properties]
  profiles.active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/prima_factory_360?serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson.time-zone: Asia/Seoul
server:
  port: 8080
  servlet.session.timeout: 30m
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
mybatis.configuration.map-underscore-to-camel-case: true
monitoring.realtime-publish-ms: ${REALTIME_PUBLISH_MS:1000}
