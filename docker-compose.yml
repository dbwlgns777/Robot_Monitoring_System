services:
  mysql:
    image: mysql:8.4
    container_name: prima-factory-360-mysql
    environment:
      MYSQL_DATABASE: prima_factory_360
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prima_local_root}
      TZ: Asia/Seoul
    ports: ["3306:3306"]
    volumes:
      - prima_factory_mysql:/var/lib/mysql
      - ./database/dump/prima_factory_360_full.sql:/docker-entrypoint-initdb.d/001-full.sql:ro
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD:-prima_local_root}"], interval: 5s, timeout: 3s, retries: 30}
volumes: {prima_factory_mysql: {}}
